AWSTemplateFormatVersion: "2010-09-09"
Description: "CloudFormation template for creating a static S3 bucket for Blackarrow"

Resources:
  BlackArrowStaticS3Bucket:
    Type: "AWS::S3::Bucket"
    Properties:
      BucketName: "blackarrow-static-website"
      WebsiteConfiguration:
        IndexDocument: "index.html"
        ErrorDocument: "error.html"
      PublicAccessBlockConfiguration:
        RestrictPublicBuckets: False
  
  BucketPolicy:
    Type: "AWS::S3::BucketPolicy"
    Properties:
      Bucket:
        Ref: BlackArrowStaticS3Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "PublicReadGetObject"
            Effect: "Allow"
            Principal: "*"
            Action: "s3:GetObject"
            Resource: !Sub "arn:aws:s3:::${BlackArrowStaticS3Bucket}/*"